name: Continuous Integration

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: make test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Format code
        run: make fmt

      - name: Check if code is formatted
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Code is not formatted. Please run 'make fmt' and commit the changes."
            git --no-pager diff
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load super-linter configuration
        run: grep -v '^#' .github/super-linter.env >> "$GITHUB_ENV"

      - name: Super-linter
        uses: super-linter/super-linter@v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kitchen-sink-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false

      - name: Install dependencies
        run: make deps

      - name: Build latest executable
        run: make build

      - name: Regenerate kitchen sink README
        run: ./bin/tfdocs-extras ./kitchen-sink-module

      - name: Fail if README changed
        run: |
          if ! git diff --exit-code -- ./kitchen-sink-module/README.md; then
            echo "::error::kitchen-sink-module/README.md is out of date. Run ./bin/tfdocs-extras ./kitchen-sink-module and commit the changes."
            exit 1
          fi
